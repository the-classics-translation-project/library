name: Refresh Gutenberg catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: ctp-state-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download one official CSV feed, not individual catalogue pages
        run: ./ctp catalogue-refresh
      - run: ./ctp validate
      - id: save
        run: |
          if git diff --quiet -- data/gutenberg-catalogue.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- data/gutenberg-catalogue.json
            git commit -m 'Refresh Gutenberg catalogue metadata'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  site:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' && vars.CTP_PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
