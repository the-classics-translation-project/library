name: Project or tooling feedback
description: Problems with the site, tooling, documentation, or project design
title: "[Project] "
body:
  - type: textarea
    id: observation
    attributes:
      label: What happened or what would you change?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include a page URL, browser, steps or relevant files where useful.
