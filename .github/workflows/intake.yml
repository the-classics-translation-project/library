name: Import work requests
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ctp-state-writer
  cancel-in-progress: false
jobs:
  intake:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read all open requests; authorize and parse strictly
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ctp intake --github
      - run: ./ctp validate
      - name: Commit only the queue; never execute Issue prose
        id: save
        run: |
          if git diff --quiet -- queue.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- queue.json
            git commit -m 'Import authorized work requests'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  site:
    needs: intake
    if: needs.intake.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    # GITHUB_TOKEN pushes do not trigger a new push workflow. Reuse explicitly.
    uses: ./.github/workflows/pages.yml
