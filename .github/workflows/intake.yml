name: Import work requests
on:
  issues:
    types: [opened, edited, reopened]
  # Reassess held requests when a cited exception or the admission rule changes.
  # GITHUB_TOKEN bot commits do not trigger another push run.
  push:
    branches: [main]
    paths:
      - 'books/*/admission-evidence.json'
      - 'tools/source_rights.py'
      - 'tools/acquire_queue.py'
      - '.github/workflows/intake.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ctp-state-writer
  cancel-in-progress: false
jobs:
  intake:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      acquired: ${{ steps.sources.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Read all open requests; authorize and parse strictly
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ctp intake --github
      - name: Parse authorized translation requests and pin their prompts
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ctp translation-intake --github
      - run: ./ctp validate
      - name: Commit only the queues; never execute Issue prose
        id: save
        run: |
          if git diff --quiet -- queue.json translation-requests.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- queue.json translation-requests.json
            git commit -m 'Import authorized work requests'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Assess US/Japan eligibility and acquire only passing sources
        run: ./ctp acquire-queued
      - run: ./ctp validate
      - name: Commit admitted source files and recorded hold reasons
        id: sources
        run: |
          ./ctp stage-acquisitions
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Assess requested sources and acquire eligible Gutenberg packages'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Report download failures after preserving successes
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report = json.loads(Path('build/source-downloads/report.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Source acquisition\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          if report['failed']:
              raise SystemExit('Acquisition errors were recorded; successful sources and hold reasons were preserved. Rerun to retry.')
          PYREPORT
  site:
    needs: intake
    if: always() && (needs.intake.outputs.changed == 'true' || needs.intake.outputs.acquired == 'true')
    permissions:
      contents: read
      pages: write
      id-token: write
    # GITHUB_TOKEN pushes do not trigger a new push workflow. Reuse explicitly.
    uses: ./.github/workflows/pages.yml
