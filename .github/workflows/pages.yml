name: Deploy catalogue and workbench
# Site deployment never promotes a draft or changes catalog.json approvals.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ctp-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: ./ctp validate
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/review-core.cjs && node tests/annotation-core.cjs
      - name: Build only the explicit catalogue (never test fixtures)
        run: ./ctp build --epub
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
